<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="application-name" content="FlashTrek: Broken Mirror 1 - Remastered" />
    <meta name="apple-mobile-web-app-title" content="BM1 Remastered" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>FlashTrek: Broken Mirror 1 - Remastered</title>
    <link rel="manifest" href="app.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/app-icons/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/app-icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css?v=20260913-approved-hull-merges-v1" />
  </head>
  <body>
    <div id="intro-story" class="intro-story hidden" aria-label="Opening story">
      <div class="intro-stars" aria-hidden="true"></div>
      <button id="intro-skip" class="intro-skip" type="button">Skip</button>
      <div class="intro-crawl-window">
        <div id="intro-story-text" class="intro-story-text"></div>
      </div>
    </div>
    <div id="start-menu" class="overlay"></div>
    <div id="gameover-menu" class="overlay hidden">
      <div class="card gameover-card">
        <h2 id="gameover-title">Game Over</h2>
        <p id="gameover-desc">Your ship has been lost.</p>
        <div class="row">
          <button id="btn-restart-game">Restart</button>
          <button id="btn-escape-pod">Escape Pod</button>
        </div>
      </div>
    </div>
    <div id="hud">
      <h1>FlashTrek: Broken Mirror 2 - Remastered</h1>
    </div>
    <div id="stats"></div>
    <div id="top-left-menu" class="top-left-menu hidden">
      <div class="top-left-tabs">
        <button data-top-left-tab="inventory">Inventory</button>
        <button data-top-left-tab="power">Power</button>
        <button data-top-left-tab="settings">Settings</button>
      </div>
    </div>
    <div id="top-left-panel" class="top-left-panel hidden"></div>
    <div id="target-window" class="target-window hidden"></div>
    <div id="security-order-panel" class="security-order-panel hidden" aria-live="polite" aria-label="Checkpoint order"></div>
    <div id="bottom-dock" class="bottom-dock hidden" aria-label="Quick actions">
      <button data-dock-action="target" title="Cycle target (Tab)"><b>TGT</b><span>Target</span></button>
      <button data-dock-action="hail" title="Hail selected ship"><b>HAIL</b><span>Hail</span></button>
      <button data-dock-action="map" title="Interstellar map (M)"><b>MAP</b><span>Map</span></button>
      <button data-dock-action="inventory" title="Cargo and inventory"><b>CAR</b><span>Cargo</span></button>
      <button data-dock-action="power" title="Power distribution (OPS)"><b>PWR</b><span>Power</span></button>
      <button data-dock-action="contract" title="Ask for contract (docked)"><b>CON</b><span>Contract</span></button>
      <button data-dock-action="save" title="Save game"><b>SAV</b><span>Save</span></button>
    </div>
    <div id="planet-menu" class="planet-menu hidden"></div>
    <div id="contract-modal" class="contract-modal hidden"></div>
    <div id="mission-complete-modal" class="contract-modal hidden"></div>
    <div id="ship-purchase-modal" class="ship-purchase-modal hidden"></div>
    <div id="fleet-purchase-modal" class="ship-purchase-modal hidden"></div>
    <div id="station-build-modal" class="ship-purchase-modal hidden"></div>
    <div id="wormhole-modal" class="ship-purchase-modal hidden"></div>
    <div id="minimap-panel" class="minimap-panel">
      <button id="btn-map">Interstellar Map</button>
      <canvas id="minimap" width="220" height="150"></canvas>
    </div>
    <canvas id="interstellar-map-canvas" class="interstellar-map-canvas hidden" width="960" height="540" aria-hidden="true"></canvas>
    <div id="interstellar-map-frame" class="interstellar-map-frame hidden" aria-hidden="true">
      <button id="btn-close-map" class="panel-close interstellar-map-close" type="button" aria-label="Close interstellar map">&times;</button>
    </div>
    <canvas id="game" width="960" height="540"></canvas>
    <script type="module" src="src/main.js?v=20260913-approved-hull-merges-v1"></script>
    <script src="src/pwa-register.js"></script>
  </body>
  </html>
